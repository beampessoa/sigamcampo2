<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sigma Planejamento — Prévia TV</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@600;700;800;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{ height:100%; width:100%; overflow:hidden; }
  body{ font-family:"Inter",system-ui,sans-serif; color:#E8EDF7;
    background:
      radial-gradient(1200px 700px at 50% 16%, rgba(15,76,186,.28), transparent 60%),
      radial-gradient(900px 600px at 82% 92%, rgba(91,138,230,.14), transparent 60%),
      linear-gradient(180deg, #0b1424 0%, #070b13 100%); }

  /* ---------- topo / rodapé fixos (não roubam espaço da TV) ---------- */
  .top{ position:fixed; top:1.6vh; left:0; right:0; display:flex; flex-direction:column; align-items:center; gap:.5vh; z-index:2; }
  .logo-chip{ background:#fff; border-radius:12px; padding:8px 16px; box-shadow:0 10px 30px -12px rgba(0,0,0,.5); }
  .logo-chip img{ height:clamp(20px,3.2vh,36px); display:block; }
  .top .sub{ color:#8FA6C9; font-size:clamp(10px,1.3vh,14px); letter-spacing:4px; text-transform:uppercase; }
  .top .scn{ color:#4D8DF6; font-weight:700; letter-spacing:1px; font-size:clamp(11px,1.4vh,15px); }

  .bottom{ position:fixed; bottom:1.4vh; left:0; right:0; text-align:center; z-index:2; }
  .bottom h1{ font-family:"Exo 2",sans-serif; font-weight:800; font-size:clamp(13px,1.9vh,22px); letter-spacing:.5px; }
  .bottom p{ margin-top:.3em; color:#8FA6C9; font-size:clamp(10px,1.3vh,14px); }

  /* ---------- controles ---------- */
  .back{ position:fixed; top:14px; left:14px; z-index:7; text-decoration:none; color:#C7D6EE;
    background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.14); padding:.5em .95em; border-radius:99px; font-size:13px; font-weight:600; }
  .back:hover{ background:rgba(255,255,255,.16); }
  .ctrl{ position:fixed; top:14px; right:14px; z-index:7; display:flex; gap:8px; flex-wrap:wrap; justify-content:flex-end; max-width:64vw; transition:opacity .25s; }
  .ctrl button{ font:inherit; font-size:13px; font-weight:600; color:#C7D6EE; cursor:pointer; white-space:nowrap;
    background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.14); padding:.5em .95em; border-radius:99px; }
  .ctrl button:hover{ background:rgba(255,255,255,.16); color:#fff; }
  .ctrl button:focus-visible, .back:focus-visible{ outline:2px solid #4D8DF6; outline-offset:2px; }
  .ctrl .key{ color:#7E93B4; font-weight:700; margin-left:.45em; font-size:11px; }
  body.idle .ctrl, body.idle .back{ opacity:0; pointer-events:none; }

  /* ---------- TV ---------- */
  .frame{ position:fixed; left:50%; top:50%; transform-origin:center center; }
  .tv{ position:relative; padding:22px; border-radius:26px; background:linear-gradient(160deg,#141924,#0a0e16);
    box-shadow:0 40px 90px -30px rgba(0,0,0,.85), 0 0 0 1px rgba(255,255,255,.05) inset; }
  .tv::after{ content:""; position:absolute; left:50%; bottom:-3px; transform:translateX(-50%); width:38%; height:4px; border-radius:0 0 8px 8px; background:#080b11; }
  .screen-area{ width:1280px; height:720px; border-radius:8px; overflow:hidden; position:relative; background:#000; }
  .screen-area iframe{ width:100%; height:100%; border:0; display:block; background:#F1F4F9; }
  .gloss{ position:absolute; inset:0; pointer-events:none; border-radius:8px; background:linear-gradient(115deg, rgba(255,255,255,.10) 0%, rgba(255,255,255,0) 22%, rgba(255,255,255,0) 100%); }
  .live{ position:absolute; top:16px; left:16px; z-index:3; display:inline-flex; align-items:center; gap:.5em; background:rgba(7,11,19,.6); backdrop-filter:blur(4px); padding:.35em .8em; border-radius:99px; font-size:13px; font-weight:700; letter-spacing:1px; color:#fff; }
  .live .b{ width:.65em; height:.65em; border-radius:99px; background:#4D8DF6; box-shadow:0 0 0 0 rgba(77,141,246,.6); animation:p 1.6s infinite; }
  @keyframes p{0%{box-shadow:0 0 0 0 rgba(77,141,246,.5)}70%{box-shadow:0 0 0 .7em rgba(77,141,246,0)}100%{box-shadow:0 0 0 0 rgba(77,141,246,0)}}
  .stand{ width:220px; height:70px; margin:0 auto; position:relative; }
  .stand::before{ content:""; position:absolute; top:0; left:50%; transform:translateX(-50%); width:26px; height:44px; background:linear-gradient(180deg,#121826,#0a0e16); }
  .stand::after{ content:""; position:absolute; bottom:0; left:50%; transform:translateX(-50%); width:200px; height:14px; border-radius:50%; background:radial-gradient(ellipse at center, #12182688 0%, rgba(0,0,0,0) 72%); }

  /* ---------- modo tela cheia (real OU simulado) ---------- */
  body.fs{ background:#05070c; }
  body.fs .top, body.fs .bottom, body.fs .stand, body.fs .back{ display:none; }
  body.fs .tv{ padding:14px; border-radius:16px; box-shadow:0 0 0 1px rgba(255,255,255,.05) inset; }
  body.fs .tv::after{ display:none; }

  /* ---------- modo sem moldura: painel ocupa tudo ---------- */
  body.nobezel .tv{ padding:0; border-radius:0; background:none; box-shadow:none; }
  body.nobezel .tv::after{ display:none; }
  body.nobezel .stand{ display:none; }
  body.nobezel .screen-area{ border-radius:0; }
  body.nobezel .gloss{ display:none; }

  /* aviso curto ao entrar em tela cheia */
  .toast{ position:fixed; bottom:18px; left:50%; transform:translateX(-50%); z-index:8; pointer-events:none;
    background:rgba(7,11,19,.78); border:1px solid rgba(255,255,255,.12); color:#C7D6EE;
    padding:.5em 1em; border-radius:99px; font-size:12.5px; font-weight:600; opacity:0; transition:opacity .3s; }
  .toast.on{ opacity:1; }

  @media (prefers-reduced-motion:reduce){ .live .b{ animation:none; } }
</style>
</head>
<body>
  <a class="back" href="apresentacao.html">← Cenários</a>
  <div class="ctrl">
    <button id="btnFs" type="button">⛶ Tela cheia<span class="key">F</span></button>
    <button id="btnBez" type="button">Moldura<span class="key">M</span></button>
  </div>

  <div class="top">
    <div class="logo-chip"><img src="https://kiwiykgzogcxiseynzyy.supabase.co/storage/v1/object/public/LOGO-Empresas/sigmacode.png" alt="Sigma Code"></div>
    <div class="sub">Sigma Planejamento</div>
    <div class="scn" id="scn"></div>
  </div>

  <div class="frame" id="frame">
    <div class="tv">
      <div class="screen-area" id="screen">
        <span class="live"><span class="b"></span>AO VIVO</span>
        <iframe id="tela" title="Painel" allowfullscreen></iframe>
        <div class="gloss"></div>
      </div>
    </div>
    <div class="stand"></div>
  </div>

  <div class="bottom">
    <h1>Refinaria Costa Azul — parada geral de manutenção</h1>
    <p>Escopo · Curva S · Cronograma · Report · Stand By — 8 telas girando a cada 10s</p>
  </div>

  <div class="toast" id="toast"></div>

<script>
  var cenNames={cenario1:"Início da Parada",cenario2:"Parada em Andamento",cenario3:"Reta Final"};
  var q=new URLSearchParams(location.search);
  var cen=q.get("cenario"); if(!/^cenario[123]$/.test(cen)){ cen = cen==="1"||cen==="2"||cen==="3" ? "cenario"+cen : "cenario2"; }
  document.getElementById("scn").textContent=cenNames[cen]||"";
  document.getElementById("tela").src="01-menu.html?tv=1&t=10&theme=sigma&demo="+cen;

  var frame=document.getElementById('frame'), screenEl=document.getElementById('screen');
  var topEl=document.querySelector('.top'), botEl=document.querySelector('.bottom');
  var btnFs=document.getElementById('btnFs'), toastEl=document.getElementById('toast');
  var simulado=false;   // tela cheia simulada (quando a API do navegador é bloqueada)

  function realFs(){ return !!(document.fullscreenElement||document.webkitFullscreenElement); }
  function emTelaCheia(){ return realFs()||simulado; }

  function toast(txt){
    toastEl.textContent=txt; toastEl.classList.add('on');
    clearTimeout(toast._t); toast._t=setTimeout(function(){ toastEl.classList.remove('on'); },2600);
  }

  function fit(){
    var fs=emTelaCheia(), nobezel=document.body.classList.contains('nobezel');
    document.body.classList.toggle('fs',fs);
    btnFs.innerHTML = fs ? '⤡ Sair da tela cheia<span class="key">Esc</span>'
                         : '⛶ Tela cheia<span class="key">F</span>';

    if(nobezel){
      screenEl.style.width=window.innerWidth+'px';
      screenEl.style.height=window.innerHeight+'px';
      frame.style.transform='translate(-50%,-50%) scale(1)';
      return;
    }

    screenEl.style.width='1280px';
    screenEl.style.height='720px';

    var pad = fs?28:44;                 // moldura da TV (2 × padding)
    var baseW = 1280+pad;
    var baseH = 720+pad+(fs?0:70);      // +70 = pedestal, só fora da tela cheia
    var reservaH = fs ? 12 : (Math.max(topEl.offsetHeight, botEl.offsetHeight)*2 + 28);
    var availW = window.innerWidth - (fs?12:32);
    var availH = window.innerHeight - reservaH;

    var s=Math.min(availW/baseW, availH/baseH);
    if(!fs) s=Math.min(s,1.6);
    frame.style.transform='translate(-50%,-50%) scale('+s+')';
  }

  function entrarSimulado(){ simulado=true; fit(); toast('Tela cheia da janela · Esc para sair'); }
  function sairSimulado(){ simulado=false; fit(); }

  function toggleFs(){
    if(simulado){ sairSimulado(); return; }

    if(realFs()){
      var sair=document.exitFullscreen||document.webkitExitFullscreen;
      if(sair) sair.call(document);
      return;
    }

    var el=document.documentElement;
    var pedir=el.requestFullscreen||el.webkitRequestFullscreen;
    if(!pedir){ entrarSimulado(); return; }

    try{
      var r=pedir.call(el);
      if(r && r.then){ r.then(fit).catch(entrarSimulado); }   // API negada (ex.: dentro de iframe) → simulado
      else { setTimeout(function(){ realFs()?fit():entrarSimulado(); },300); }
    }catch(e){ entrarSimulado(); }
  }

  function toggleBezel(){ document.body.classList.toggle('nobezel'); fit(); }

  btnFs.addEventListener('click',toggleFs);
  document.getElementById('btnBez').addEventListener('click',toggleBezel);
  document.addEventListener('dblclick',function(e){ if(!e.target.closest('.ctrl,.back')) toggleFs(); });
  document.addEventListener('keydown',function(e){
    var k=(e.key||'').toLowerCase();
    if(k==='f'){ toggleFs(); }
    else if(k==='m'){ toggleBezel(); }
    else if(k==='escape' && simulado){ sairSimulado(); }
  });
  ['fullscreenchange','webkitfullscreenchange'].forEach(function(ev){ document.addEventListener(ev,fit); });
  ['resize','orientationchange'].forEach(function(ev){ window.addEventListener(ev,fit); });

  // controles somem com o mouse parado (tela limpa para print/vídeo)
  var t; function wake(){ document.body.classList.remove('idle'); clearTimeout(t);
    t=setTimeout(function(){ document.body.classList.add('idle'); },2600); }
  ['mousemove','keydown','touchstart'].forEach(function(ev){ document.addEventListener(ev,wake); });
  wake();

  fit(); window.addEventListener('load',fit);
</script>
</body>
</html>
